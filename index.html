<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tarat.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Wrapped 2025 — Tarat</title>
  </head>
  <style>
    iframe{
      visibility: hidden;
    }
  </style>
  <body>
    <div id="app" class="h-dvh"></div>
    <canvas id="webgl"></canvas>
    
    <!-- Loading Screen -->
    <div id="loader" class="loader">
      <div class="loader-content">
        <span class="loader-icon">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="#1DB954">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </span>
        <h1 class="loader-title">Tarat's Top 100</h1>
        <p class="loader-subtitle">songs on Spotify this year</p>
        <div class="loader-spinner"></div>
      </div>
    </div>

    <!-- Header Branding -->
    <header class="header-branding">
      <div class="branding-left">
        <span class="spotify-icon">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#1DB954">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
        </span>
        <div class="branding-text">
          <span class="wrapped-title">Wrapped 2025</span>
          <span class="wrapped-subtitle">for Tarat</span>
        </div>
      </div>
      <a href="https://tarat.space" target="_blank" rel="noopener noreferrer" class="garden-link">
        <span>tarat.space</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7V17"/>
        </svg>
      </a>
    </header>

    <!-- Bottom Player UI -->
    <div id="bottom-player" class="bottom-player hidden">
      <div class="player-content">
        <div class="track-info-section">
          <img id="player-album-art" class="album-art" src="" alt="Album Art" />
          <div class="track-details">
            <div id="player-track-name" class="track-name">Select a song</div>
            <div id="player-artist-name" class="artist-name">Click on an album cover</div>
          </div>
        </div>
        <button id="play-pause-btn" class="play-pause-btn">
          <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
      </div>
    </div>

    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
